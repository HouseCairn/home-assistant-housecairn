          readOnly: true
          description: The sum of the planned amounts of the budget lines.
        committed:
          type: string
          format: decimal
          example: '1250.50'
          readOnly: true
          description: The sum of the quotes accepted on the budget lines.
        paid:
          type: string
          format: decimal
