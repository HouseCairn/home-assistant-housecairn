openapi: 3.1.0
info:
  title: HouseCairn API
  version: 1.0.0
  description: Version 1 of the HouseCairn API, shared by every client.
paths:
  /api/v1/account/delete/:
    post:
      operationId: account_delete_create
      description: Erase the account of the signed-in person, for good. The address
        (and the password, for an account that has one) confirm it. Refused while
        the account is the only owner of a home with other members, or the only administrator.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
        required: true
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/budget/:
    get:
      operationId: budget_list
      description: Every home of the caller, added by currency. Currencies are never
        converted.
      parameters:
      - in: query
        name: year
        schema:
          type: integer
        description: Defaults to this year.
      tags:
      - budget
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Combined'
          description: ''
  /api/v1/calendar/:
    get:
      operationId: calendar_retrieve
      description: The occurrences of the caller's homes from one date to another,
        projections included.
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: home
        schema:
          type: string
          format: uuid
        description: Only this home.
      - in: query
        name: person
        schema:
          type: string
        description: A member's id, or `none`.
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - normal
      - in: query
        name: room
        schema:
          type: string
          format: uuid
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: At most 400 days after `from`.
        required: true
      tags:
      - calendar
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
          description: ''
  /api/v1/homes/:
    get:
      operationId: homes_list
      description: |-
        Homes of the authenticated user (narrowed to the token's homes, if any).

        The list includes homes locked behind a sign-in provider (`locked`); reading
        or changing one answers 403 with `code: sso_required` until the session
        signs in through it.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHomeList'
          description: ''
    post:
      operationId: homes_create
      description: |-
        Homes of the authenticated user (narrowed to the token's homes, if any).

        The list includes homes locked behind a sign-in provider (`locked`); reading
        or changing one answers 403 with `code: sso_required` until the session
        signs in through it.
      tags:
      - homes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeRequest'
        required: true
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
          description: ''
  /api/v1/homes/{home_id}/:
    get:
      operationId: homes_retrieve
      description: |-
        Homes of the authenticated user (narrowed to the token's homes, if any).

        The list includes homes locked behind a sign-in provider (`locked`); reading
        or changing one answers 403 with `code: sso_required` until the session
        signs in through it.
      parameters:
      - in: path
        name: home_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this home.
        required: true
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
          description: ''
    patch:
      operationId: homes_partial_update
      description: |-
        Homes of the authenticated user (narrowed to the token's homes, if any).

        The list includes homes locked behind a sign-in provider (`locked`); reading
        or changing one answers 403 with `code: sso_required` until the session
        signs in through it.
      parameters:
      - in: path
        name: home_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this home.
        required: true
      tags:
      - homes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHomeRequest'
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
          description: ''
  /api/v1/homes/{home_id}/articles/:
    get:
      operationId: homes_articles_list
      description: |-
        Stock items of a home, with their quantity. The photo of the label is sent as
        `multipart/form-data` (`label`), checked by its content, written again without its
        metadata (location included) and limited in size.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: query
        name: item
        schema:
          type: string
          format: uuid
        description: Only those compatible with this item.
      - in: query
        name: low
        schema:
          type: boolean
        description: 'True: only those at or below their threshold.'
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Only names, manufacturer references and suppliers containing
          this text.
      - in: query
        name: room
        schema:
          type: string
          format: uuid
        description: 'Only those that concern this room: listed on it, fitting an
          item of it, or its paint left over.'
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleList'
          description: ''
    post:
      operationId: homes_articles_create
      description: |-
        Stock items of a home, with their quantity. The photo of the label is sent as
        `multipart/form-data` (`label`), checked by its content, written again without its
        metadata (location included) and limited in size.
      parameters:
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
        required: true
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
  /api/v1/homes/{home_id}/articles/{article_id}/:
    get:
      operationId: homes_articles_retrieve
      description: |-
        Stock items of a home, with their quantity. The photo of the label is sent as
        `multipart/form-data` (`label`), checked by its content, written again without its
        metadata (location included) and limited in size.
      parameters:
      - in: path
        name: article_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this stock item.
        required: true
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
    patch:
      operationId: homes_articles_partial_update
      description: |-
        Stock items of a home, with their quantity. The photo of the label is sent as
        `multipart/form-data` (`label`), checked by its content, written again without its
        metadata (location included) and limited in size.
      parameters:
      - in: path
        name: article_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this stock item.
        required: true
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArticleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArticleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArticleRequest'
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
    delete:
      operationId: homes_articles_destroy
      description: |-
        Stock items of a home, with their quantity. The photo of the label is sent as
        `multipart/form-data` (`label`), checked by its content, written again without its
        metadata (location included) and limited in size.
      parameters:
      - in: path
        name: article_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this stock item.
        required: true
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/homes/{home_id}/articles/{article_id}/label/:
    get:
      operationId: homes_articles_label_retrieve
      description: 'The photo of the label, as stored: JPEG, PNG or WebP, served inline
        and never sniffed.'
      parameters:
      - in: path
        name: article_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this stock item.
        required: true
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            image/*:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/homes/{home_id}/attachments/:
    get:
      operationId: homes_attachments_list
      description: |-
        Photos and files of tasks. Upload as `multipart/form-data`.

        An image is checked by its content and written again without its metadata
        (location included); any other file must be of an accepted type, checked by its
        content. All are limited in size and only ever served back as stored.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: query
        name: occurrence
        schema:
          type: string
          format: uuid
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: task
        schema:
          type: string
          format: uuid
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttachmentList'
          description: ''
    post:
      operationId: homes_attachments_create
      description: |-
        Photos and files of tasks. Upload as `multipart/form-data`.

        An image is checked by its content and written again without its metadata
        (location included); any other file must be of an accepted type, checked by its
        content. All are limited in size and only ever served back as stored.
      parameters:
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
        required: true
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/homes/{home_id}/attachments/{attachment_id}/:
    get:
      operationId: homes_attachments_retrieve
      description: |-
        Photos and files of tasks. Upload as `multipart/form-data`.

        An image is checked by its content and written again without its metadata
        (location included); any other file must be of an accepted type, checked by its
        content. All are limited in size and only ever served back as stored.
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    patch:
      operationId: homes_attachments_partial_update
      description: |-
        Photos and files of tasks. Upload as `multipart/form-data`.

        An image is checked by its content and written again without its metadata
        (location included); any other file must be of an accepted type, checked by its
        content. All are limited in size and only ever served back as stored.
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAttachmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAttachmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAttachmentRequest'
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    delete:
      operationId: homes_attachments_destroy
      description: |-
        Photos and files of tasks. Upload as `multipart/form-data`.

        An image is checked by its content and written again without its metadata
        (location included); any other file must be of an accepted type, checked by its
        content. All are limited in size and only ever served back as stored.
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/homes/{home_id}/attachments/{attachment_id}/content/:
    get:
      operationId: homes_attachments_content_retrieve
      description: 'The file as stored: an image inline, any other file as a download,
        never sniffed.'
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/homes/{home_id}/attachments/{attachment_id}/thumbnail/:
    get:
      operationId: homes_attachments_thumbnail_retrieve
      description: A JPEG thumbnail of an image (404 for a file that is not an image).
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this attachment.
        required: true
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/homes/{home_id}/audit/:
    get:
      operationId: homes_audit_list
      description: 'Audit log of the home: roles, invitations, sign-in rule, export.
        Owners only.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: home_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this home.
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/homes/{home_id}/budget/:
    get:
      operationId: homes_budget_retrieve
      description: The envelope of the year, then the figures by nature, by year and
        over 12 months.
      parameters:
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
        description: '`csv` answers with the same figures as a file (text/csv).'
      - in: path
        name: home_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: year
        schema:
          type: integer
        description: Defaults to this year.
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
          description: ''
  /api/v1/homes/{home_id}/budget-lines/:
    get:
      operationId: homes_budget_lines_list
      description: 'The budget lines of the projects of a home: label, nature, planned,
        committed, paid.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
          format: uuid
        description: Only the rows of this project.
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBudgetLineList'
          description: ''
    post:
      operationId: homes_budget_lines_create
      description: 'The budget lines of the projects of a home: label, nature, planned,
        committed, paid.'
      parameters:
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - homes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetLineRequest'
        required: true
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetLine'
          description: ''
  /api/v1/homes/{home_id}/budget-lines/{line_id}/:
    get:
      operationId: homes_budget_lines_retrieve
      description: 'The budget lines of the projects of a home: label, nature, planned,
        committed, paid.'
      parameters:
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget line.
        required: true
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetLine'
          description: ''
    patch:
      operationId: homes_budget_lines_partial_update
      description: 'The budget lines of the projects of a home: label, nature, planned,
        committed, paid.'
      parameters:
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget line.
        required: true
      tags:
      - homes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBudgetLineRequest'
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetLine'
          description: ''
    delete:
      operationId: homes_budget_lines_destroy
      description: 'The budget lines of the projects of a home: label, nature, planned,
        committed, paid.'
      parameters:
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget line.
        required: true
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/homes/{home_id}/budget/projects/:
    get:
      operationId: homes_budget_projects_retrieve
      description: The budget of every project, each counted in the year it starts.
      parameters:
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
        description: '`csv` answers with the same figures as a file (text/csv).'
      - in: path
        name: home_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectReport'
          description: ''
  /api/v1/homes/{home_id}/budget/rooms/:
