components:
  schemas:
    AccountDeletionRequest:
      type: object
      properties:
        confirm_email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - confirm_email
    Amounts:
      type: object
      description: 'The amounts of a row. Gap: planned less engaged; negative, the
        budget is exceeded.'
      properties:
        planned:
          type: string
          format: decimal
          example: '1250.50'
          readOnly: true
        committed:
          type: string
          format: decimal
          example: '1250.50'
          readOnly: true
        paid:
          type: string
          format: decimal
          example: '1250.50'
          readOnly: true
        engaged:
          type: string
          format: decimal
          example: '1250.50'
          readOnly: true
          description: 'Shown as Used: the more of committed and paid, line by line.'
        gap:
          type: string
          format: decimal
          example: '1250.50'
          readOnly: true
        to_pay:
          type: string
          format: decimal
          example: '1250.50'
          readOnly: true
          description: Committed and not paid yet, line by line.
        budget_state:
          allOf:
          - $ref: '#/components/schemas/BudgetStateEnum'
          readOnly: true
      required:
      - budget_state
      - committed
      - engaged
      - gap
      - paid
      - planned
      - to_pay
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        manufacturer_reference:
          type: string
          maxLength: 120
        dimensions:
          type: string
          maxLength: 120
        storage_location:
          type: string
          description: 'For example: garage, second shelf.'
          maxLength: 200
        unit:
          description: |-
            A unit of the list, or `other` with `unit_other` saying which.

            * `` - none
            * `piece` - Piece
            * `litre` - Litre
            * `metre` - Metre
            * `kilogram` - Kilogram
            * `roll` - Roll
            * `box` - Box
            * `other` - Other
          oneOf:
          - $ref: '#/components/schemas/UnitEnum'
          - $ref: '#/components/schemas/BlankEnum'
        unit_other:
          type: string
          title: Which unit
          description: 'Only with the unit Other. Example: bag.'
          maxLength: 24
        unit_label:
          type: string
          readOnly: true
          description: The unit as people read it, in the language of the request.
        threshold:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: The stock is flagged when it falls to this quantity or below.
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: The sum of the movements; change it with a movement.
        low:
          type: boolean
          readOnly: true
          description: True when the quantity is at or below the threshold.
        compatible_items:
          type: array
          items:
            type: string
            format: uuid
          description: Items of the home this stock item fits.
        rooms:
          type: array
          items:
            type: string
            format: uuid
          description: Rooms of the home where it is used, besides those of the items
            it fits.
        notes:
          type: string
          maxLength: 4000
        label_url:
          type: string
          format: uri
          readOnly: true
          description: Address of the photo of the label, or null.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - label_url
      - low
      - name
      - quantity
      - unit_label
      - updated_at
    ArticleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        manufacturer_reference:
          type: string
          maxLength: 120
        dimensions:
          type: string
          maxLength: 120
        storage_location:
          type: string
          description: 'For example: garage, second shelf.'
          maxLength: 200
        unit:
          description: |-
            A unit of the list, or `other` with `unit_other` saying which.

            * `` - none
            * `piece` - Piece
            * `litre` - Litre
            * `metre` - Metre
            * `kilogram` - Kilogram
            * `roll` - Roll
            * `box` - Box
            * `other` - Other
          oneOf:
          - $ref: '#/components/schemas/UnitEnum'
          - $ref: '#/components/schemas/BlankEnum'
        unit_other:
          type: string
          title: Which unit
          description: 'Only with the unit Other. Example: bag.'
          maxLength: 24
        threshold:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: The stock is flagged when it falls to this quantity or below.
        compatible_items:
          type: array
          items:
            type: string
            format: uuid
          description: Items of the home this stock item fits.
        rooms:
          type: array
          items:
            type: string
            format: uuid
          description: Rooms of the home where it is used, besides those of the items
            it fits.
        notes:
          type: string
          maxLength: 4000
        label:
          type: string
          format: binary
          writeOnly: true
          description: A JPEG, PNG or WebP photo of the label.
        clear_label:
          type: boolean
          writeOnly: true
