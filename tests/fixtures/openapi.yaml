  /api/v1/homes/{home_id}/occurrences/:
    get:
      operationId: homes_occurrences_list
      description: |-
        Each time a task has to be done, with its status.

        `complete` (a single call, for every task) closes an occurrence as done and creates
        the next when the task repeats; `undo` takes it back, the created occurrence included.
        `PATCH` completes what is known of a task that is done: date, real cost, note.
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
          format: uuid
      - in: query
        name: closed_after
        schema:
          type: string
          format: date
        description: Closed on or after this date.
      - in: query
        name: closed_before
        schema:
          type: string
          format: date
        description: Closed on or before this date.
      - in: query
        name: completed_by
        schema:
          type: string
          format: uuid
        description: Who closed the occurrence.
      - in: query
        name: contractor
        schema:
          type: string
          format: uuid
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: due_after
        schema:
          type: string
          format: date
        description: Due on or after this date.
      - in: query
        name: due_before
        schema:
          type: string
          format: date
        description: Due on or before this date.
      - in: path
        name: home_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: query
        name: include_hidden
        schema:
          type: boolean
        description: Also the open occurrences hidden until a few days before their
          date.
      - in: query
        name: item
        schema:
          type: string
          format: uuid
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - recent
        description: '`recent`: the latest closed first, as the History screen.'
      - in: query
        name: overdue
        schema:
          type: boolean
        description: Open and past their date.
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Words of the task title or of the note of the occurrence.
      - in: query
        name: room
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
          enum:
          - closed
          - done
          - open
          - planned
          - postponed
          - skipped
      - in: query
        name: task
        schema:
          type: string
          format: uuid
      tags:
      - homes
      security:
      - apiToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOccurrenceList'
          description: ''
