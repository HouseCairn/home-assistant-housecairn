report:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: housecairn
    title:
      required: true
      example: "Smoke detector battery low"
      selector:
        text:
    room:
      required: false
      example: "3f2b0c7e-1d2a-4c5b-9e8f-0a1b2c3d4e5f"
      selector:
        text:
    item:
      required: false
      example: "3f2b0c7e-1d2a-4c5b-9e8f-0a1b2c3d4e5f"
      selector:
        text:
    article:
      required: false
      example: "3f2b0c7e-1d2a-4c5b-9e8f-0a1b2c3d4e5f"
      selector:
        text:
    entity_id:
      required: false
      example: "binary_sensor.boiler_problem"
      selector:
        entity:
    area_id:
      required: false
      selector:
        area:
    create_item:
      required: false
      default: false
      selector:
        boolean:
