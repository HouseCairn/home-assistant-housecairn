blueprint:
  name: Report a problem in Housecairn when a value stays below a threshold
  description: >-
    When the value of one of the chosen sensors stays below a threshold for a
    while (a battery level, a pressure), report the problem in Housecairn. The
    report goes to the room with the name of the area of the entity (or of its
    device), and to the item of that room with the name of the device; the device
    is added to the room when it has no item by that name. Nothing is created
    twice while the report is not closed.
    Needs the Housecairn integration with a token that has the Write right.
    To try it, put the entity in the wanted state (Developer tools > States):
    running the actions by hand has no entity to report, so nothing is reported.
  domain: automation
  author: Housecairn
  source_url: https://github.com/HouseCairn/home-assistant-housecairn/blob/main/blueprints/automation/housecairn/report_below_threshold.yaml
  homeassistant:
    min_version: "2026.10.0"
  input:
    home:
      name: Home
      description: The Housecairn home to report the problem in.
      selector:
        config_entry:
          integration: housecairn
    entities:
      name: Sensors
      description: The sensors whose value is watched (a battery level in %).
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
    threshold:
      name: Below
      description: The value under which there is a problem.
      default: 20
      selector:
        number:
          min: -1000
          max: 100000
          step: any
          mode: box
    duration:
      name: For
      description: How long the value must stay below the threshold before the report.
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:
    title:
      name: Title
      description: >-
        What is wrong, 200 characters at most. A template: `trigger.to_state.name`
        is the name of the entity.
      default: "Low: {{ trigger.to_state.name }}"
      selector:
        text:
    area:
      name: Area
      description: >-
        Optional. An area whose room of the same name is used instead of the area
        of the entity.
      default: ""
      selector:
        area:
    create_item:
      name: Add the device if missing
      description: >-
        Add the device of the entity to the room as a piece of equipment when the
        room has no item with its name.
      default: true
      selector:
        boolean:

mode: queued

triggers:
  - trigger: numeric_state
    entity_id: !input entities
    below: !input threshold
    for: !input duration

actions:
  # "Run actions" by hand (or `automation.trigger`) gives a `trigger` with no
  # `to_state` and no `entity_id`: there is nothing to report, so stop cleanly.
  - if:
      - condition: template
        value_template: "{{ trigger is not defined or trigger.to_state is not defined }}"
    then:
      - stop: >-
          Run by hand: nothing is reported. To try it, put the entity in the
          wanted state.
  - action: housecairn.report
    data:
      config_entry_id: !input home
      title: !input title
      entity_id: "{{ trigger.entity_id }}"
      area_id: !input area
      create_item: !input create_item
